<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 작업실로 가는 중…</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#1b1838; color:#ecebff;
         font-family:"Pretendard",system-ui,sans-serif; text-align:center; padding:16px; }
  a { color:#9fe8ff; }
</style>
<script>
  // 이 주소로 들어오면 메인 마을의 "내 집(작업실)"로 바로 이동해요.
  var repo = location.pathname.split("/").filter(Boolean)[0] || "game-template";
  location.replace("/#/house/" + repo);
</script>
</head>
<body>
  <div>
    <p>🏠 내 작업실로 가는 중이에요…</p>
    <p><a id="go" href="/">바로 가기</a></p>
  </div>
  <script>document.getElementById("go").href = "/#/house/" + (location.pathname.split("/").filter(Boolean)[0] || "");</script>
</body>
</html>
