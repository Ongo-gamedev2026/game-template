<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>온고 게임제작반 아케이드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.39.3/dist/galmuri.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <p class="insert">INSERT COIN ▸ PRESS START</p>
  <h1>온고 게임제작반<br><span>ARCADE</span></h1>
  <p class="sub">AI와 함께 기획하고, 만들고, 고친 우리들의 게임</p>
  <div class="stats" id="stats"></div>
</header>

<main>
  <nav class="filters" id="filters">
    <button class="on" data-f="all">전체</button>
    <button data-f="done">완성</button>
    <button data-f="wip">개발 중</button>
  </nav>
  <section class="grid" id="grid"></section>
  <p class="empty" id="empty" hidden></p>
</main>

<footer>
  <p>Ongo-gamedev2026 · 2026 게임 만들기 동아리</p>
</footer>

<dialog id="qrDialog">
  <h2 id="qrTitle"></h2>
  <div id="qrBox"></div>
  <p id="qrUrl" class="qr-url"></p>
  <div class="qr-actions">
    <button id="qrSave">QR 이미지 저장</button>
    <button id="qrClose" class="ghost">닫기</button>
  </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="app.js"></script>
</body>
</html>
