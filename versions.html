<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 게임 · 버전별 플레이</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  :root { --bg:#0d0b1e; --panel:#18153a; --line:#2e2a63; --text:#ecebff; --muted:#9a96c8; --pink:#ff4fa3; --cyan:#3ee6ff; --green:#4ade80; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Pretendard",system-ui,sans-serif; line-height:1.6; }
  a { color:var(--cyan); }
  header { text-align:center; padding:36px 16px 14px; }
  h1 { margin:0 0 4px; font-size:clamp(22px,5vw,30px); }
  h1 span { color:var(--pink); }
  header p { margin:0; color:var(--muted); }
  .wrap { max-width:960px; margin:0 auto; padding:0 16px 48px; }
  .back { display:inline-block; margin:0 0 12px; color:var(--muted); text-decoration:none; }
  .back:hover { color:var(--pink); }
  .vers { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 12px; }
  .vers button { font:inherit; font-size:14px; font-weight:700; cursor:pointer; background:var(--panel); color:var(--text); border:2px solid var(--line); padding:7px 14px; }
  .vers button:hover { border-color:var(--pink); }
  .vers button.on { background:var(--pink); border-color:var(--pink); color:#0d0b1e; }
  .stage { background:#000; border:2px solid var(--line); position:relative; overflow:hidden; height:min(70vh,640px); }
  /* 게임은 원래 해상도 그대로 띄우고, 화면에 맞게 통째로 확대·축소해요 */
  .stage iframe { position:absolute; top:0; left:0; transform-origin:0 0; border:0; background:#fff; }
  .stage:fullscreen { border:0; width:100vw; height:100vh; }
  .stage:-webkit-full-screen { border:0; width:100vw; height:100vh; }
  .bar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; margin:8px 0 26px; color:var(--muted); font-size:14px; }
  .bar button { font:inherit; font-size:14px; cursor:pointer; background:none; color:var(--cyan); border:1px solid var(--line); padding:5px 12px; }
  h2 { font-size:19px; margin:0 0 12px; }
  h2 b { color:var(--cyan); }
  .note { background:var(--panel); border:2px solid var(--line); padding:14px 18px; margin:0 0 12px; }
  .note.on { border-color:var(--pink); }
  .note-head { display:flex; flex-wrap:wrap; gap:8px; align-items:baseline; margin-bottom:6px; }
  .note-head b { font-size:16px; }
  .note-head span { color:var(--muted); font-size:13px; }
  .note-head button { margin-left:auto; font:inherit; font-size:13px; cursor:pointer; background:none; color:var(--pink); border:1px solid var(--line); padding:3px 10px; }
  .note .md { font-size:15px; }
  .note .md h2, .note .md h3 { font-size:15px; margin:8px 0 4px; color:var(--cyan); }
  .note .md ul { margin:4px 0; padding-left:20px; }
  .note .md p { margin:4px 0; }
  .none { color:var(--muted); font-size:14px; }
  .intro { background:var(--panel); border:2px solid var(--line); padding:14px 18px; margin:0 0 14px; }
  .intro h2 { margin:0 0 6px; font-size:20px; color:var(--pink); }
  .intro p { margin:4px 0; }
  .intro .keys { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:8px; font-size:14px; color:var(--muted); }
  .intro kbd { font:inherit; font-weight:700; color:var(--text); background:#0d0b1e; border:1px solid var(--line); padding:1px 8px; margin-right:4px; }
  .golink { display:inline-block; margin-left:12px; color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<header>
  <h1>🕹️ <span id="who">내</span> 게임</h1>
  <p>버전을 골라 플레이하고, 버전마다 무엇이 바뀌었는지 패치노트로 확인해요</p>
</header>
<div class="wrap">
  <a class="back" href="./" target="_top">← 작업실로</a><a class="golink" href="#reviews">💬 플레이 소감 보러 가기 ↓</a>
  <div id="intro"></div>
  <div class="vers" id="vers"></div>
  <div class="stage"><iframe id="game" title="게임" sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-modals" allow="fullscreen; gamepad; autoplay"></iframe></div>
  <div class="bar">
    <span id="playing">불러오는 중…</span>
    <span><button id="newwin">↗ 새 창으로</button> <button id="full">⛶ 전체 화면</button></span>
  </div>
  <h2>📜 <b>패치노트</b></h2>
  <div id="notes"><p class="none">불러오는 중…</p></div>
  <div id="rvBox"></div>
</div>
<script src="/review.js"></script>
<script>
const ORG = "Ongo-gamedev2026";
const REPO = location.pathname.split("/").filter(Boolean)[0] || "game-template";
const RAW = ref => `https://raw.githubusercontent.com/${ORG}/${REPO}/${ref}/play/index.html`;
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmt = iso => { const d = new Date(iso); return `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}.`; };
const md = t => (window.marked && window.DOMPurify) ? DOMPurify.sanitize(marked.parse(t || "", { breaks:true })) : `<p>${esc(t).replace(/\n/g,"<br>")}</p>`;
const isPlaceholder = html => /<title>\s*게임 준비 중\s*<\/title>/.test(html);
const frame = document.getElementById("game");
let versions = [];   // [{key, label, rec, html}]  key "latest" = 지금 올라가 있는 게임

function play(key){
  const v = versions.find(x => x.key === key); if(!v) return;
  window.rvKey = v.key;
  if (v.key === "latest") { frame.removeAttribute("srcdoc"); frame.src = "play/"; }
  else { frame.removeAttribute("src"); frame.srcdoc = v.html; }
  window.rvVersion = v.key === "latest" ? "최신 버전" : v.label;
  const vt = document.querySelector(".rv [data-ver]"); if (vt) vt.textContent = "지금 플레이 중: " + window.rvVersion;
  document.querySelectorAll("#vers button").forEach(b => b.classList.toggle("on", b.dataset.k === key));
  document.querySelectorAll(".note").forEach(n => n.classList.toggle("on", n.dataset.k === key));
  document.getElementById("playing").textContent = v.key === "latest"
    ? "▶ 지금 올라가 있는 최신 게임 · 게임 화면을 한 번 클릭한 뒤 키보드를 써요"
    : `▶ ${v.label} (${fmt(v.rec.published_at)} 제출) · 게임 화면을 한 번 클릭한 뒤 키보드를 써요`;
  frame.focus();
}
// ── 화면 맞춤: 게임의 원래 크기를 재서, 보이는 영역에 꼭 맞게 확대·축소 ──
const stage = document.querySelector(".stage");
const BASE = { w:1280, h:800 };          // 창 크기에 맞춰 늘어나는 게임은 이 크기로 그려요
let GW = BASE.w, GH = BASE.h;
const isFull = () => (document.fullscreenElement || document.webkitFullscreenElement) === stage;
function fit(){
  const fs = isFull();
  const availW = stage.clientWidth;
  const availH = fs ? stage.clientHeight : Math.max(300, Math.min(window.innerHeight - 140, 900));
  const s = Math.min(availW / GW, availH / GH, fs ? 4 : 2);
  if (!fs) stage.style.height = Math.round(GH * s) + "px";
  const top = fs ? (stage.clientHeight - GH * s) / 2 : 0;
  frame.style.width = GW + "px"; frame.style.height = GH + "px";
  frame.style.transform = `translate(${(availW - GW * s) / 2}px, ${top}px) scale(${s})`;
}
function measure(){             // body 바로 아래 요소들이 차지하는 실제 크기
  try {
    const d = frame.contentDocument; if (!d || !d.body) return null;
    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
    for (const el of d.body.children) {
      if (/^(SCRIPT|STYLE|LINK|NOSCRIPT|TEMPLATE)$/.test(el.tagName)) continue;
      const cs = d.defaultView.getComputedStyle(el);
      if (cs.display === "none" || cs.visibility === "hidden" || cs.position === "fixed") continue;
      const r = el.getBoundingClientRect(); if (!r.width || !r.height) continue;
      x1 = Math.min(x1, r.left); y1 = Math.min(y1, r.top); x2 = Math.max(x2, r.right); y2 = Math.max(y2, r.bottom);
    }
    return x2 > x1 ? { w:x2 - x1, h:y2 - y1 } : null;
  } catch (_) { return null; }
}
function autosize(){
  const m = measure();
  const fills = !m || (m.w >= GW - 8 && m.h >= GH - 8);   // 창을 꽉 채우는 게임 → 기본 크기 유지
  if (!fills) { GW = Math.ceil(m.w) + 24; GH = Math.ceil(m.h) + 24; }
  fit();
}
frame.addEventListener("load", () => {
  GW = BASE.w; GH = BASE.h; fit();
  requestAnimationFrame(autosize); setTimeout(autosize, 600);   // 시작 화면이 늦게 그려지는 게임 대비
});
window.addEventListener("resize", fit);
document.addEventListener("fullscreenchange", fit);
document.addEventListener("webkitfullscreenchange", fit);
fit();

document.getElementById("full").onclick = () => {
  if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (stage.requestFullscreen || stage.webkitRequestFullscreen || (()=>{})).call(stage);
  setTimeout(() => frame.focus(), 100);
};
document.getElementById("newwin").onclick = () => {
  const v = versions.find(x => x.key === window.rvKey); if (!v) return;
  if (v.key === "latest") window.open("play/", "_blank");
  else window.open(URL.createObjectURL(new Blob([v.html], { type:"text/html" })), "_blank");
};

(async () => {
  const [stu, sub] = await Promise.all([
    fetch("/students.json", {cache:"no-store"}).then(r => r.json()).catch(() => ({students:[]})),
    fetch("/data/submissions.json", {cache:"no-store"}).then(r => r.json()).catch(() => ({records:[]}))
  ]);
  const me = (stu.students || []).find(s => s.repo === REPO);
  if (me) document.getElementById("who").textContent = `학생 ${me.no}` + (me.nickname ? ` · ${me.nickname}` : "") + "의";
  const recs = (sub.records || []).filter(r => r.repo === REPO);

  // 방금 올린 제출도 바로 보이도록(제출 기록 모으기는 15분마다 돌아요), 이 저장소의 제출(릴리스)을 직접 확인해요.
  // 릴리스 이름에서 게임 버전(ver4)과 만든 도구(Antigravity)도 알아내요. 확인이 안 되면 기록만으로 보여 줘요.
  let live = [];
  try {
    const ck = "rel:" + REPO; let c = null;
    try { c = JSON.parse(sessionStorage.getItem(ck) || "null"); } catch (_) {}
    if (c && Date.now() - c.t < 120000) live = c.d;
    else {
      const r = await fetch(`https://api.github.com/repos/${ORG}/${REPO}/releases?per_page=100`);
      if (r.ok) {
        live = (await r.json()).filter(x => !x.draft).map(x => ({ tag:x.tag_name, name:x.name || "", notes:(x.body || "").slice(0, 3000), published_at:x.published_at || x.created_at }));
        try { sessionStorage.setItem(ck, JSON.stringify({ t:Date.now(), d:live })); } catch (_) {}
      }
    }
  } catch (_) {}
  live.forEach(x => {
    const m = /^week(\d+)-v(\d+)$/.exec(x.tag || ""); if (!m) return;
    const r = recs.find(r => r.tag === x.tag);
    if (r) { if (!r.name) r.name = x.name; }
    else recs.push({ repo:REPO, tag:x.tag, week:+m[1], version:+m[2], published_at:x.published_at, notes:x.notes, name:x.name });
  });
  recs.sort((a,b) => new Date(a.published_at) - new Date(b.published_at));

  // 제출된 버전마다 그때의 게임 파일을 불러와서, 게임이 실제로 바뀐 제출만 버전으로 보여요
  const files = await Promise.all(recs.map(r => fetch(RAW(r.tag)).then(x => x.ok ? x.text() : null).catch(() => null)));
  let prev = null;
  recs.forEach((r, i) => {
    const html = files[i];
    if (!html || isPlaceholder(html) || html === prev) return;
    prev = html;
    const g = /ver\s*(\d+)/i.exec(r.name || "");
    versions.push({ key:r.tag, label:`${r.week}주차 v${r.version}` + (g ? ` · ver${g[1]}` : "") + (/Antigravity/i.test(r.name || "") ? " 🛸 Antigravity" : ""), rec:r, html });
  });
  versions.push({ key:"latest", label:"최신", rec:null, html:null });

  document.getElementById("vers").innerHTML = versions.map(v =>
    `<button data-k="${esc(v.key)}">${v.key === "latest" ? "⭐ 최신" : esc(v.label)}</button>`).join("");
  document.querySelectorAll("#vers button").forEach(b => b.onclick = () => play(b.dataset.k));

  const withNotes = versions.filter(v => v.rec).slice().reverse();
  document.getElementById("notes").innerHTML = withNotes.length ? withNotes.map(v => `
    <article class="note" data-k="${esc(v.key)}">
      <div class="note-head"><b>${esc(v.label)}</b><span>${fmt(v.rec.published_at)}</span>
        <button data-play="${esc(v.key)}">▶ 이 버전 플레이</button></div>
      <div class="md">${v.rec.notes ? md(v.rec.notes) : `<p class="none">패치노트를 쓰지 않았어요.</p>`}</div>
    </article>`).join("")
    : `<p class="none">아직 제출한 게임 버전이 없어요. 게임을 올리고 📮 제출하기를 누르면, 그때 쓴 패치노트가 여기에 쌓여요.</p>`;
  document.querySelectorAll("[data-play]").forEach(b => b.onclick = () => { play(b.dataset.play); scrollTo({top:0, behavior:"smooth"}); });

  // 게임 소개 (5주차에 완성 버전을 올리면 game.json이 생겨요)
  try {
    const g = await fetch(`https://raw.githubusercontent.com/${ORG}/${REPO}/main/game.json?t=${Date.now()}`).then(r => r.ok ? r.json() : null);
    if (g && (g.title || g.intro)) {
      if (g.title) document.title = g.title;
      document.getElementById("intro").innerHTML = `<div class="intro"><h2>🕹️ ${esc(g.title || "내 게임")}${g.ver ? ` <small style="color:var(--muted);font-size:14px">${esc(g.ver)}</small>` : ""}</h2>
        ${g.intro ? `<p>${esc(g.intro)}</p>` : ""}${g.goal ? `<p>🎯 <b>목표</b> ${esc(g.goal)}</p>` : ""}
        ${(g.controls || []).length ? `<div class="keys">${g.controls.map(c => `<span><kbd>${esc(c[0])}</kbd>${esc(c[1])}</span>`).join("")}</div>` : ""}</div>`;
    }
  } catch (_) {}

  const want = new URLSearchParams(location.search).get("v");
  play(versions.some(v => v.key === want) ? want : "latest");

  // 💬 플레이 소감 · 댓글 (메인 사이트의 review.js)
  if (window.Reviews) {
    Reviews.mount(document.getElementById("rvBox"), REPO);
    if (location.hash === "#reviews") setTimeout(() => { const r = document.getElementById("reviews"); if (r) r.scrollIntoView({ behavior:"smooth" }); }, 1200);
  }
})();
</script>
</body>
</html>
